openapi: '3.1.0'
info:
  title: Rings of Power API
  version: '2.1.0'
  description: Forge, track and destroy Rings of Power. Handle with care; some rings have opinions.
servers:
  - url: https://api.middle-earth.example/v3
    description: Eregion (production)
  - url: https://sandbox.middle-earth.example/v3
    description: Mount Doom (sandbox)
security:
  - bearerAuth: []
paths:
  /rings:
    post:
      tags: [Rings]
      summary: Forge a ring
      operationId: forgeRing
      description: Forges a new ring. Requires a smith with the right credentials and a suitable fire.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Any unique string. Reusing one returns the original ring instead of forging a second.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgeRingRequest' }
      responses:
        '201':
          description: Ring forged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ring' }
        '403':
          description: The smith is not permitted to forge this kind of ring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The ring could not be forged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rings/{ring_id}:
    get:
      tags: [Rings]
      summary: Retrieve a ring
      operationId: getRing
      description: Retrieves a ring by its identifier.
      parameters:
        - name: ring_id
          in: path
          required: true
          description: The ring's identifier.
          schema: { type: string }
      responses:
        '200':
          description: The ring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ring' }
        '404':
          description: No such ring. It may not want to be found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rings/{ring_id}/bearer:
    put:
      tags: [Rings]
      summary: Bear a ring
      operationId: bearRing
      description: Assigns a bearer to a ring.
      parameters:
        - name: ring_id
          in: path
          required: true
          description: The ring's identifier.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BearRingRequest' }
      responses:
        '200':
          description: The updated ring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ring' }
        '403':
          description: The ring refused the bearer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such ring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rings/{ring_id}/destruction:
    post:
      tags: [Rings]
      summary: Destroy a ring
      operationId: destroyRing
      description: Casts a ring into the fire. This cannot be undone.
      parameters:
        - name: ring_id
          in: path
          required: true
          description: The ring's identifier.
          schema: { type: string }
      responses:
        '200':
          description: The ring was destroyed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ring' }
        '404':
          description: No such ring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    RingKind:
      type: string
      description: The kind of ring.
      enum: [elven, dwarven, human, one]
    Metal:
      type: string
      description: Metal the ring is made from.
      enum: [gold, silver, mithril, iron]
    Inscription:
      type: object
      description: Text inscribed on the ring.
      required: [text, language]
      properties:
        text: { type: string, description: The inscribed words. }
        language:
          type: string
          description: Language of the inscription.
          enum: [black_speech, sindarin, quenya, westron]
        visible_when_heated: { type: boolean, default: false, description: Whether the text only appears when heated. }
    ForgeRingRequest:
      type: object
      required: [kind, metal, smith_id]
      properties:
        kind: { $ref: '#/components/schemas/RingKind' }
        metal: { $ref: '#/components/schemas/Metal' }
        smith_id: { type: string, description: The forging smith. }
        gem: { type: string, description: Optional gem to set into the ring. }
        inscription: { $ref: '#/components/schemas/Inscription' }
        dark_lord_approval:
          type: string
          description: Approval token from the Dark Lord.
      if:
        properties:
          kind: { const: one }
        required: [kind]
      then:
        required: [dark_lord_approval, inscription]
    BearRingRequest:
      type: object
      required: [bearer_id]
      properties:
        bearer_id: { type: string, description: The new bearer. }
        willing: { type: boolean, default: false, description: Whether the bearer takes the ring willingly. }
    Ring:
      type: object
      required: [id, kind, metal, status]
      properties:
        id: { type: string, readOnly: true, description: Unique identifier. }
        kind: { $ref: '#/components/schemas/RingKind' }
        metal: { $ref: '#/components/schemas/Metal' }
        status:
          type: string
          description: Where the ring is right now.
          enum: [forged, worn, lost, destroyed]
        bearer_id:
          type: [string, 'null']
          description: The current bearer.
        inscription: { $ref: '#/components/schemas/Inscription' }
        corruption_level:
          type: integer
          minimum: 0
          maximum: 100
          readOnly: true
          description: How corrupting the ring is.
        forged_at: { type: string, format: date-time, readOnly: true, description: When the ring was forged. }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [you_shall_not_pass] }
        message: { type: string, description: Human-readable explanation of the problem. }
        request_id: { type: string, description: Identifier to quote when contacting support. }
